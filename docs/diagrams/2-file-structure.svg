<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="950" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#17607d">Airfield sits on top of a normal ROS 2 workspace</text>
  <text x="750" y="66" text-anchor="middle" font-size="14" fill="#666666">example project my_robot/ &#8212; airfield adds a few YAML files around the ROS code, never inside it</text>

  <!-- Legend -->
  <rect x="1020" y="88" width="18" height="14" rx="3" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
  <text x="1046" y="100" font-size="12.5" fill="#555555">standard ROS 2 files</text>
  <rect x="1200" y="88" width="18" height="14" rx="3" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="1226" y="100" font-size="12.5" fill="#555555">added by airfield</text>

  <!-- ================ Project container ================ -->
  <rect x="60" y="130" width="920" height="780" rx="12" fill="#fdf9ec" stroke="#d8c98e" stroke-width="1.6"/>
  <text x="85" y="162" font-size="18" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#8a6a15">my_robot/</text>
  <text x="268" y="162" font-size="13" fill="#666666">&#8212; the project: a ROS 2 workspace</text>

  <!-- project airfield.yaml -->
  <rect x="90" y="185" width="430" height="76" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="105" y="210" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">airfield.yaml</text>
  <text x="105" y="230" font-size="12" fill="#31597e">kind: project &#8212; sets ros_distro &amp; base_image for</text>
  <text x="105" y="247" font-size="12" fill="#31597e">every package; lists source repos (subprojects)</text>

  <!-- packages/ container -->
  <rect x="90" y="285" width="860" height="450" rx="10" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2"/>
  <text x="108" y="313" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#444444">packages/</text>
  <text x="218" y="313" font-size="12.5" fill="#666666">&#8212; each subfolder is one airfield package &#8594; one container image</text>

  <!-- base_driver -->
  <rect x="112" y="330" width="390" height="330" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  <text x="128" y="358" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#333333">base_driver/</text>

  <text x="128" y="388" font-size="13" font-family="Menlo, Consolas, monospace" fill="#333333">package.xml   CMakeLists.txt</text>
  <text x="128" y="414" font-size="13" font-family="Menlo, Consolas, monospace" fill="#333333">src/</text>
  <text x="170" y="414" font-size="12" fill="#777777">&#8212; motor_driver, joystick, gui (ROS nodes)</text>
  <text x="128" y="440" font-size="13" font-family="Menlo, Consolas, monospace" fill="#333333">launch/   config/</text>

  <rect x="128" y="466" width="358" height="94" rx="7" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="142" y="490" font-size="13.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">airfield.yaml</text>
  <text x="142" y="510" font-size="11.5" fill="#31597e">kind: package &#8212; dependencies, devices, and a</text>
  <text x="142" y="527" font-size="11.5" fill="#31597e">run: map naming each ros2 run / launch target</text>
  <text x="142" y="544" font-size="11.5" fill="#31597e">(motor_driver | joystick | gui)</text>

  <rect x="128" y="574" width="358" height="64" rx="7" fill="#eef5fc" stroke="#7da7d9" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="142" y="598" font-size="13.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">.air</text>
  <text x="188" y="598" font-size="11.5" fill="#31597e">(optional, gitignored)</text>
  <text x="142" y="620" font-size="11.5" fill="#31597e">machine-local extras, e.g. additional mounts</text>

  <!-- camera_driver -->
  <rect x="522" y="330" width="200" height="330" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  <text x="534" y="358" font-size="13.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#333333">camera_driver/</text>
  <text x="534" y="388" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">package.xml</text>
  <text x="534" y="412" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">src/</text>
  <text x="548" y="432" font-size="11" fill="#777777">image_processor,</text>
  <text x="548" y="448" font-size="11" fill="#777777">stereo_processor</text>
  <rect x="534" y="466" width="176" height="56" rx="7" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="546" y="488" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">airfield.yaml</text>
  <text x="546" y="508" font-size="11" fill="#31597e">kind: package</text>

  <!-- nav_stack -->
  <rect x="742" y="330" width="186" height="330" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  <text x="754" y="358" font-size="13.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#333333">nav_stack/</text>
  <text x="754" y="388" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">package.xml</text>
  <text x="754" y="412" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">src/  launch/</text>
  <text x="754" y="436" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333333">maps/</text>
  <rect x="754" y="466" width="162" height="56" rx="7" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="766" y="488" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">airfield.yaml</text>
  <text x="766" y="508" font-size="11" fill="#31597e">kind: package</text>

  <text x="112" y="706" font-size="12" font-style="italic" fill="#777777">&#8230; more packages: imu_driver, teleop, my_msgs &#8212; and config-only ones (vnc, rviz2, foxglove) that are just an airfield.yaml, no source</text>

  <!-- dependencies/ -->
  <rect x="90" y="760" width="420" height="110" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="105" y="788" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">dependencies/</text>
  <text x="258" y="788" font-size="12" fill="#31597e">&#8212; how to install each dependency</text>
  <text x="105" y="816" font-size="12" font-family="Menlo, Consolas, monospace" fill="#31597e">xplatform/  rclcpp.yaml  urg_node.yaml &#8230;</text>
  <text x="105" y="840" font-size="12" font-family="Menlo, Consolas, monospace" fill="#31597e">arm64/  x86_64/</text>
  <text x="255" y="840" font-size="11.5" fill="#31597e">(per-target-architecture)</text>

  <!-- plans/ -->
  <rect x="540" y="760" width="410" height="110" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="555" y="788" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">plans/</text>
  <text x="630" y="788" font-size="12" fill="#31597e">&#8212; named launch targets (diagram 4)</text>
  <text x="555" y="816" font-size="12" font-family="Menlo, Consolas, monospace" fill="#31597e">navstack.yaml</text>
  <text x="700" y="816" font-size="11.5" fill="#31597e">&#8212; the full driving stack</text>
  <text x="555" y="840" font-size="12" font-family="Menlo, Consolas, monospace" fill="#31597e">teleop.yaml</text>
  <text x="700" y="840" font-size="11.5" fill="#31597e">&#8212; drive by joystick</text>

  <!-- ================ Callouts (right column) ================ -->
  <text x="1030" y="200" font-size="13" fill="#555555">one file makes a workspace an airfield project &#8212;</text>
  <text x="1030" y="219" font-size="13" fill="#555555">and pins the ROS distro + container base image</text>
  <text x="1030" y="238" font-size="13" fill="#555555">for every package (single source of truth)</text>
  <line x1="1022" y1="207" x2="526" y2="220" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="1030" y="345" font-size="13" fill="#555555">an airfield package wraps <tspan font-weight="bold">one or more</tspan> ROS</text>
  <text x="1030" y="364" font-size="13" fill="#555555">packages: base_driver ships motor_driver, joystick</text>
  <text x="1030" y="383" font-size="13" fill="#555555">and gui as separate run targets in one container</text>
  <line x1="1022" y1="352" x2="954" y2="352" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="1030" y="480" font-size="13" fill="#555555">one file per package: what to build (source_path),</text>
  <text x="1030" y="499" font-size="13" fill="#555555">what it needs (dependencies), what it can run</text>
  <text x="1030" y="518" font-size="13" fill="#555555">(run:) &#8212; the ROS sources are never modified</text>
  <line x1="1022" y1="487" x2="922" y2="490" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="1030" y="800" font-size="13" fill="#555555">everything airfield adds is a handful of YAML</text>
  <text x="1030" y="819" font-size="13" fill="#555555">files &#8212; remove them and you are left with a</text>
  <text x="1030" y="838" font-size="13" fill="#555555">plain ROS 2 workspace again</text>
  <line x1="1022" y1="807" x2="954" y2="807" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>
</svg>
