<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e5fa3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#17607d">A plan is a launch target: windows &#8594; panes &#8594; (package, cmd)</text>
  <text x="700" y="66" text-anchor="middle" font-size="14" fill="#666666">one YAML file in plans/ describes everything &#8220;airfield project up&#8221; should launch</text>

  <!-- file tab + card -->
  <rect x="60" y="100" width="250" height="36" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="185" y="124" text-anchor="middle" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">plans/navstack.yaml</text>
  <rect x="60" y="136" width="660" height="604" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>

  <!-- YAML body (mono 14.5, lh 30) -->
  <text x="90" y="180" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">name: </tspan><tspan fill="#333333">navstack</tspan></text>
  <text x="90" y="210" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">pre_window: </tspan><tspan fill="#333333">export MAP=speedway</tspan></text>

  <text x="90" y="254" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#17607d">windows:</text>
  <text x="116" y="284" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">- name: </tspan><tspan fill="#333333">main</tspan></text>
  <text x="142" y="314" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">layout: </tspan><tspan fill="#333333">main-vertical</tspan></text>
  <text x="142" y="344" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#17607d">panes:</text>
  <text x="168" y="374" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">- </tspan><tspan fill="#999999" font-style="italic">null</tspan></text>

  <text x="168" y="404" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">- package: </tspan><tspan fill="#1f4e79" font-weight="bold">camera_driver</tspan></text>
  <text x="194" y="434" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">cmd: </tspan><tspan fill="#38761d">ros2 run camera_driver image_processor</tspan></text>

  <text x="168" y="464" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">- package: </tspan><tspan fill="#1f4e79" font-weight="bold">base_driver</tspan></text>
  <text x="194" y="494" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">cmd: </tspan><tspan fill="#38761d">ros2 run base_driver motor_driver</tspan></text>

  <text x="168" y="524" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">- package: </tspan><tspan fill="#1f4e79" font-weight="bold">base_driver</tspan></text>
  <text x="194" y="554" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">cmd: </tspan><tspan fill="#38761d">ros2 run base_driver joystick</tspan></text>

  <text x="168" y="584" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">- package: </tspan><tspan fill="#1f4e79" font-weight="bold">nav_stack</tspan></text>
  <text x="194" y="614" font-size="14.5" font-family="Menlo, Consolas, monospace"><tspan fill="#17607d">cmd: </tspan><tspan fill="#38761d">ros2 launch nav_stack navigation.launch.py</tspan></text>

  <!-- ============ annotations ============ -->
  <text x="780" y="160" font-size="13" fill="#555555">the plan's name &#8212;</text>
  <text x="780" y="179" font-size="13" fill="#555555"><tspan font-family="Menlo, Consolas, monospace">airfield project up navstack</tspan> launches it</text>
  <line x1="772" y1="168" x2="225" y2="174" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="780" y="215" font-size="13" fill="#555555">environment exported into every pane</text>
  <line x1="772" y1="210" x2="375" y2="206" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="780" y="272" font-size="13" fill="#555555">tmux geometry: a session has windows,</text>
  <text x="780" y="291" font-size="13" fill="#555555">each window holds panes (layout = arrangement)</text>
  <line x1="772" y1="282" x2="290" y2="308" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="780" y="372" font-size="13" fill="#555555">a bare shell pane &#8212; no container</text>
  <line x1="772" y1="368" x2="245" y2="370" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="780" y="408" font-size="13" fill="#555555"><tspan font-weight="bold">package:</tspan> which package's container this pane</text>
  <text x="780" y="427" font-size="13" fill="#555555">runs in &#8212; its image from diagram 3, phase 1</text>
  <line x1="772" y1="412" x2="400" y2="400" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="780" y="462" font-size="13" fill="#555555"><tspan font-weight="bold">cmd:</tspan> what to run inside &#8212; almost always</text>
  <text x="780" y="481" font-size="13" fill="#555555">a <tspan font-family="Menlo, Consolas, monospace">ros2 run</tspan> or <tspan font-family="Menlo, Consolas, monospace">ros2 launch</tspan> line</text>
  <line x1="772" y1="466" x2="605" y2="432" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- bracket for the two base_driver panes -->
  <path d="M 630 450 L 644 450 L 644 560 L 630 560" fill="none" stroke="#9c6b1f" stroke-width="1.4"/>
  <text x="780" y="512" font-size="13" fill="#555555">the same package can drive many panes &#8212;</text>
  <text x="780" y="531" font-size="13" fill="#555555">base_driver appears twice: <tspan font-weight="bold">one image,</tspan></text>
  <text x="780" y="550" font-size="13" fill="#555555"><tspan font-weight="bold">many containers</tspan> (motor_driver + joystick)</text>
  <line x1="772" y1="517" x2="650" y2="505" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ============ tmux mock ============ -->
  <line x1="724" y1="672" x2="772" y2="672" stroke="#2e5fa3" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>

  <rect x="780" y="580" width="560" height="220" rx="8" fill="#2e3440" stroke="#4c566a" stroke-width="1.4"/>
  <text x="800" y="602" font-size="11" font-family="Menlo, Consolas, monospace" fill="#d8dee9">tmux &#183; navstack</text>

  <rect x="792" y="612" width="270" height="176" fill="#3b4252" stroke="#4c566a" stroke-width="1"/>
  <text x="804" y="632" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#a3be8c">bash  (the null pane)</text>

  <rect x="1066" y="612" width="262" height="40" fill="#3b4252" stroke="#4c566a" stroke-width="1"/>
  <text x="1076" y="636" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#a3be8c">camera_driver &#183; image_processor</text>
  <rect x="1066" y="658" width="262" height="40" fill="#3b4252" stroke="#4c566a" stroke-width="1"/>
  <text x="1076" y="682" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#a3be8c">base_driver &#183; motor_driver</text>
  <rect x="1066" y="704" width="262" height="40" fill="#3b4252" stroke="#4c566a" stroke-width="1"/>
  <text x="1076" y="728" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#a3be8c">base_driver &#183; joystick</text>
  <rect x="1066" y="750" width="262" height="38" fill="#3b4252" stroke="#4c566a" stroke-width="1"/>
  <text x="1076" y="774" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#a3be8c">nav_stack &#183; navigation.launch.py</text>

  <text x="1060" y="830" text-anchor="middle" font-size="12" font-style="italic" fill="#666666">&#8220;project up&#8221; renders the plan into this tmux session &#8212; diagram 5</text>
</svg>
