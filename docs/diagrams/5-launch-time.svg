<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1000" viewBox="0 0 1650 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2d6f8e"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b8935a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1650" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="540" y="40" font-size="24" font-weight="bold" fill="#17607d">Launch time:</text>
  <text x="705" y="40" font-size="24" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#17607d">airfield project up navstack</text>
  <text x="825" y="66" text-anchor="middle" font-size="14" fill="#666666">the plan fans out to one tmux pane per entry &#8212; every containerized pane is diagram 3's run phase, sharing one workspace</text>

  <!-- ===== pipeline row ===== -->
  <rect x="60" y="95" width="290" height="64" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="75" y="122" font-size="14" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">plans/navstack.yaml</text>
  <text x="75" y="144" font-size="11.5" fill="#31597e">the plan &#8212; diagram 4</text>

  <line x1="350" y1="127" x2="430" y2="127" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="119" text-anchor="middle" font-size="11.5" fill="#555555">render</text>

  <rect x="434" y="95" width="350" height="64" rx="8" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
  <text x="450" y="122" font-size="13" font-family="Menlo, Consolas, monospace" fill="#333333">.airfield/navstack.tmuxinator.yml</text>
  <text x="450" y="144" font-size="11.5" fill="#777777">generated tmux session config</text>

  <line x1="609" y1="159" x2="609" y2="196" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="182" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#555555">tmuxinator start</text>

  <!-- ===== tmux session ===== -->
  <rect x="60" y="200" width="580" height="640" rx="10" fill="#f4f7f9" stroke="#2d6f8e" stroke-width="1.6"/>
  <text x="80" y="227" font-size="15" font-weight="bold" fill="#17607d">tmux session: navstack</text>
  <text x="280" y="227" font-size="11.5" fill="#666666">(one pane per plan entry)</text>

  <!-- pane 0 -->
  <rect x="80" y="250" width="540" height="56" rx="7" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.2"/>
  <text x="95" y="274" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#555555">pane 0 &#183; bash</text>
  <text x="95" y="293" font-size="11" fill="#888888">the null pane &#8212; a bare shell, no container</text>

  <!-- pane 1 -->
  <rect x="80" y="320" width="540" height="96" rx="7" fill="#ffffff" stroke="#a9c6d6" stroke-width="1.3"/>
  <text x="95" y="344" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">pane 1 &#183; camera_driver</text>
  <text x="95" y="364" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">airfield package cmd camera_driver \</text>
  <text x="95" y="380" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">  -- "ros2 run camera_driver image_processor"</text>

  <!-- pane 2 -->
  <rect x="80" y="430" width="540" height="96" rx="7" fill="#ffffff" stroke="#a9c6d6" stroke-width="1.3"/>
  <text x="95" y="454" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">pane 2 &#183; base_driver</text>
  <text x="95" y="474" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">airfield package cmd base_driver \</text>
  <text x="95" y="490" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">  -- "ros2 run base_driver motor_driver"</text>

  <!-- pane 3 -->
  <rect x="80" y="540" width="540" height="96" rx="7" fill="#ffffff" stroke="#a9c6d6" stroke-width="1.3"/>
  <text x="95" y="564" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">pane 3 &#183; base_driver</text>
  <text x="95" y="584" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">airfield package cmd base_driver \</text>
  <text x="95" y="600" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">  -- "ros2 run base_driver joystick"</text>

  <!-- pane 4 -->
  <rect x="80" y="650" width="540" height="96" rx="7" fill="#ffffff" stroke="#a9c6d6" stroke-width="1.3"/>
  <text x="95" y="674" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">pane 4 &#183; nav_stack</text>
  <text x="95" y="694" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">airfield package cmd nav_stack \</text>
  <text x="95" y="710" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">  -- "ros2 launch nav_stack navigation.launch.py"</text>

  <text x="80" y="795" font-size="11.5" font-style="italic" fill="#666666">pre_window env (export MAP=speedway) is exported in every pane</text>

  <!-- ===== pane -> container arrows ===== -->
  <line x1="620" y1="368" x2="726" y2="368" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="478" x2="726" y2="478" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="588" x2="726" y2="588" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="698" x2="726" y2="698" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== containers ===== -->
  <rect x="730" y="320" width="450" height="96" rx="10" fill="#ffffff" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="745" y="344" font-size="12" font-weight="bold" fill="#38761d">container &#183; camera_driver</text>
  <rect x="1030" y="330" width="140" height="20" rx="10" fill="#eef6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="1100" y="344" text-anchor="middle" font-size="10" fill="#38761d">diagram 3 &#183; phase 2</text>
  <text x="745" y="370" font-size="10.5" fill="#555555">entry: colcon-build camera_driver if missing (flock-serialized)</text>
  <text x="745" y="392" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">exec ros2 run camera_driver image_processor</text>

  <rect x="730" y="430" width="450" height="96" rx="10" fill="#ffffff" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="745" y="454" font-size="12" font-weight="bold" fill="#38761d">container &#183; base_driver</text>
  <rect x="1030" y="440" width="140" height="20" rx="10" fill="#eef6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="1100" y="454" text-anchor="middle" font-size="10" fill="#38761d">diagram 3 &#183; phase 2</text>
  <text x="745" y="480" font-size="10.5" fill="#555555">entry: colcon-build base_driver if missing (flock-serialized)</text>
  <text x="745" y="502" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">exec ros2 run base_driver motor_driver</text>

  <rect x="730" y="540" width="450" height="96" rx="10" fill="#ffffff" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="745" y="564" font-size="12" font-weight="bold" fill="#38761d">container &#183; base_driver</text>
  <rect x="1030" y="550" width="140" height="20" rx="10" fill="#eef6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="1100" y="564" text-anchor="middle" font-size="10" fill="#38761d">diagram 3 &#183; phase 2</text>
  <text x="745" y="590" font-size="10.5" fill="#555555">entry: install/ already has base_driver &#8594; skip straight to exec</text>
  <text x="745" y="612" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">exec ros2 run base_driver joystick</text>

  <rect x="730" y="650" width="450" height="96" rx="10" fill="#ffffff" stroke="#6aa84f" stroke-width="1.8"/>
  <text x="745" y="674" font-size="12" font-weight="bold" fill="#38761d">container &#183; nav_stack</text>
  <rect x="1030" y="660" width="140" height="20" rx="10" fill="#eef6ea" stroke="#6aa84f" stroke-width="1"/>
  <text x="1100" y="674" text-anchor="middle" font-size="10" fill="#38761d">diagram 3 &#183; phase 2</text>
  <text x="745" y="700" font-size="10.5" fill="#555555">entry: colcon-build nav_stack if missing (flock-serialized)</text>
  <text x="745" y="722" font-size="11" font-family="Menlo, Consolas, monospace" fill="#38761d">exec ros2 launch nav_stack navigation.launch.py</text>

  <!-- ===== images column ===== -->
  <text x="1430" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#17607d">images &#8212; built once by package build</text>
  <text x="1430" y="315" text-anchor="middle" font-size="11.5" fill="#666666">(diagram 3, phase 1)</text>

  <rect x="1290" y="336" width="280" height="64" rx="10" fill="#2d5f73"/>
  <text x="1430" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#ffffff">airfield-pkg-camera_driver</text>
  <path d="M 1286 368 L 1188 368" fill="none" stroke="#2d6f8e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowTeal)"/>

  <rect x="1290" y="500" width="280" height="64" rx="10" fill="#2d5f73"/>
  <text x="1430" y="538" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#ffffff">airfield-pkg-base_driver</text>
  <path d="M 1286 520 C 1240 520, 1240 478, 1192 478" fill="none" stroke="#2d6f8e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowTeal)"/>
  <path d="M 1286 544 C 1240 544, 1240 588, 1192 588" fill="none" stroke="#2d6f8e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowTeal)"/>
  <text x="1430" y="590" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5fa3">one image &#8594; many containers</text>

  <rect x="1290" y="666" width="280" height="64" rx="10" fill="#2d5f73"/>
  <text x="1430" y="704" text-anchor="middle" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#ffffff">airfield-pkg-nav_stack</text>
  <path d="M 1286 698 L 1188 698" fill="none" stroke="#2d6f8e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowTeal)"/>

  <!-- ===== workspace bus ===== -->
  <path d="M 726 400 L 712 400 L 712 845 L 722 845" fill="none" stroke="#b8935a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <line x1="726" y1="510" x2="712" y2="510" stroke="#b8935a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="726" y1="620" x2="712" y2="620" stroke="#b8935a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="726" y1="730" x2="712" y2="730" stroke="#b8935a" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== shared workspace ===== -->
  <rect x="730" y="800" width="860" height="90" rx="8" fill="#fdf6e3" stroke="#dcc98c" stroke-width="1.4"/>
  <text x="750" y="830" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#8a6a15">~/workspace/</text>
  <text x="892" y="830" font-size="12" fill="#8a6a15">(src &#183; build &#183; install &#183; log) &#8212; one shared colcon workspace on the host (same-path .air mounts)</text>
  <text x="750" y="854" font-size="11.5" fill="#8a6a15">mounted into every container at the same path &#8212; the first container to need a package builds it, the rest just source install/</text>

  <text x="1160" y="920" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5fa3">"build once, launch many": the first base_driver container takes the build lock and compiles;</text>
  <text x="1160" y="939" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5fa3">the second one waits, then simply sources install/ and launches</text>

  <!-- ===== teardown note ===== -->
  <rect x="60" y="880" width="580" height="84" rx="8" fill="#f5f5f5" stroke="#c8c8c8" stroke-width="1.3" stroke-dasharray="7,5"/>
  <text x="80" y="908" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#4a4a4a">$ airfield project down</text>
  <text x="80" y="930" font-size="11.5" fill="#666666">kills the session; each pane's airfield process stops</text>
  <text x="80" y="948" font-size="11.5" fill="#666666">its own container &#8212; no orphans left behind</text>
</svg>
