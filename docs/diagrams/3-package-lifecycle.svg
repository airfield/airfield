<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e5fa3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38761d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="990" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#17607d">The life of one package: build the environment once, compile &amp; run at launch</text>
  <text x="800" y="66" text-anchor="middle" font-size="14" fill="#666666">the image holds the environment; the ROS code stays on the host, live-mounted and compiled inside the container on first run</text>

  <!-- ================ PHASE 1 ================ -->
  <rect x="50" y="95" width="1500" height="330" rx="12" fill="#e9f3f8" stroke="#b5d5e5" stroke-width="1.5"/>
  <text x="75" y="127" font-size="16" font-weight="bold" fill="#17607d">PHASE 1 &#8212; build the image</text>
  <text x="75" y="147" font-size="12.5" fill="#17607d">(once &#8212; and again only when dependencies change)</text>

  <rect x="1050" y="105" width="470" height="36" rx="18" fill="#ffffff" stroke="#2d6f8e" stroke-width="1.3"/>
  <text x="1285" y="128" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#333333">$ airfield package build base_driver</text>

  <!-- inputs -->
  <rect x="80" y="175" width="330" height="88" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="95" y="200" font-size="13.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">packages/base_driver/airfield.yaml</text>
  <text x="95" y="222" font-size="11.5" fill="#31597e">dependencies: [rclcpp, urg_node, &#8230;]</text>
  <text x="95" y="240" font-size="11.5" fill="#31597e">base_image &#183; devices &#183; colcon_args</text>

  <rect x="80" y="285" width="330" height="104" rx="8" fill="#d9eaf7" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="95" y="310" font-size="13.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#1f4e79">dependencies/*.yaml manifests</text>
  <text x="95" y="332" font-size="11.5" fill="#31597e">per-dependency install recipes</text>
  <text x="95" y="350" font-size="11.5" fill="#31597e">(apt system: / pip user: commands)</text>
  <text x="95" y="368" font-size="11.5" fill="#31597e">resolved per target arch, local &#8594; global</text>

  <line x1="410" y1="219" x2="466" y2="250" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="337" x2="466" y2="290" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- resolve -->
  <rect x="470" y="225" width="190" height="90" rx="8" fill="#ffffff" stroke="#2d6f8e" stroke-width="1.6"/>
  <text x="565" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#17607d">resolve</text>
  <text x="565" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#17607d">dependencies</text>

  <line x1="660" y1="270" x2="716" y2="270" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- generate dockerfile -->
  <rect x="720" y="185" width="330" height="195" rx="8" fill="#ffffff" stroke="#2d6f8e" stroke-width="1.6"/>
  <text x="735" y="212" font-size="14.5" font-weight="bold" fill="#17607d">generate a Dockerfile</text>
  <text x="735" y="240" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#333333">FROM &lt;base_image&gt;</text>
  <text x="735" y="257" font-size="10.5" fill="#777777">package override &#8594; project default &#8594; ROS default</text>
  <text x="735" y="284" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#333333">install apt system deps + pip user deps</text>
  <text x="735" y="301" font-size="10.5" fill="#777777">from the dependency manifests</text>
  <text x="735" y="328" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#333333">create user matching the host user</text>
  <text x="735" y="352" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#333333">COPY /opt/airfield-entry.sh</text>
  <text x="735" y="369" font-size="10.5" fill="#777777">the first-run build logic used in phase 2</text>

  <line x1="1050" y1="270" x2="1106" y2="270" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- docker build -->
  <rect x="1110" y="235" width="150" height="70" rx="8" fill="#ffffff" stroke="#2d6f8e" stroke-width="1.6"/>
  <text x="1185" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#17607d">docker build</text>

  <line x1="1260" y1="270" x2="1316" y2="270" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- image -->
  <rect x="1320" y="225" width="220" height="90" rx="10" fill="#2d5f73"/>
  <text x="1430" y="262" text-anchor="middle" font-size="14.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#ffffff">airfield-pkg-</text>
  <text x="1430" y="284" text-anchor="middle" font-size="14.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#ffffff">base_driver:latest</text>

  <text x="800" y="407" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9c6b1f">Note: no ROS source code goes into the image &#8212; it is a frozen environment, rebuilt only when the environment changes.</text>

  <!-- reuse arrow phase1 -> phase2 -->
  <path d="M 1430 315 L 1430 442 L 340 442 L 340 526" fill="none" stroke="#2e5fa3" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrowBlue)"/>
  <text x="885" y="437" text-anchor="middle" font-size="12.5" font-style="italic" fill="#2e5fa3">image reused for every run &#8212; and for every plan pane (diagram 5)</text>

  <!-- ================ PHASE 2 ================ -->
  <rect x="50" y="460" width="1500" height="470" rx="12" fill="#eef6ea" stroke="#a9cf9b" stroke-width="1.5"/>
  <text x="75" y="492" font-size="16" font-weight="bold" fill="#38761d">PHASE 2 &#8212; run</text>
  <text x="75" y="512" font-size="12.5" fill="#38761d">(every run; compiles on the first)</text>

  <rect x="1000" y="470" width="520" height="36" rx="18" fill="#ffffff" stroke="#6aa84f" stroke-width="1.3"/>
  <text x="1260" y="493" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#333333">$ airfield package run base_driver motor_driver</text>

  <!-- docker run -->
  <rect x="110" y="530" width="250" height="80" rx="8" fill="#ffffff" stroke="#6aa84f" stroke-width="1.6"/>
  <text x="125" y="558" font-size="14.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#38761d">docker run</text>
  <text x="125" y="580" font-size="11.5" fill="#555555">a fresh container from image</text>
  <text x="125" y="597" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#555555">airfield-pkg-base_driver</text>

  <!-- mounts -->
  <rect x="110" y="630" width="250" height="175" rx="8" fill="#f7fbf5" stroke="#b7d7ab" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="125" y="656" font-size="12" font-weight="bold" fill="#38761d">live mounts (zero-copy):</text>
  <text x="125" y="682" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">src/ (this pkg + peers)</text>
  <text x="125" y="706" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">~/workspace/ (via .air)</text>
  <text x="125" y="730" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">/dev/&#8230; devices</text>
  <text x="125" y="754" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444">GPU / Jetson runtime</text>
  <line x1="235" y1="626" x2="235" y2="616" stroke="#6aa84f" stroke-width="1.4" marker-end="url(#arrowGreen)"/>

  <line x1="360" y1="570" x2="396" y2="570" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- container -->
  <rect x="400" y="515" width="870" height="290" rx="12" fill="#ffffff" stroke="#6aa84f" stroke-width="2"/>
  <text x="420" y="542" font-size="13.5" font-weight="bold" fill="#38761d">container (ephemeral &#8212; removed on exit)</text>

  <!-- entry script -->
  <rect x="420" y="560" width="215" height="64" rx="7" fill="#eef6ea" stroke="#6aa84f" stroke-width="1.3"/>
  <text x="432" y="586" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#38761d">/opt/airfield-entry.sh</text>
  <text x="432" y="606" font-size="11" fill="#555555">baked in during phase 1</text>

  <line x1="635" y1="592" x2="651" y2="592" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="760,540 865,592 760,644 655,592" fill="#fdf6e3" stroke="#c9a93c" stroke-width="1.5"/>
  <text x="760" y="588" text-anchor="middle" font-size="11.5" fill="#7a5c10">base_driver</text>
  <text x="760" y="604" text-anchor="middle" font-size="11.5" fill="#7a5c10">already in install/?</text>

  <!-- yes branch -->
  <line x1="865" y1="592" x2="1081" y2="592" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="973" y="584" text-anchor="middle" font-size="11" fill="#38761d">yes &#8212; skip the build</text>

  <!-- no branch -->
  <line x1="760" y1="644" x2="760" y2="672" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="750" y="664" text-anchor="end" font-size="11" fill="#9c6b1f">no &#8212; first run</text>

  <!-- colcon build -->
  <rect x="650" y="676" width="390" height="92" rx="7" fill="#eef6ea" stroke="#6aa84f" stroke-width="1.3"/>
  <text x="665" y="700" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#38761d">colcon build --packages-up-to base_driver</text>
  <text x="665" y="720" font-size="10.5" fill="#555555">into the shared ~/workspace/install &#8212; flock-serialized,</text>
  <text x="665" y="736" font-size="10.5" fill="#555555">parallelism-capped: concurrent containers never build at once</text>
  <text x="665" y="756" font-size="10.5" font-style="italic" fill="#888888">later runs skip this &#8212; install/ is already there</text>

  <path d="M 1040 722 L 1172 722 L 1172 640" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- exec -->
  <rect x="1085" y="552" width="175" height="84" rx="7" fill="#ffffff" stroke="#6aa84f" stroke-width="1.5"/>
  <text x="1097" y="576" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#38761d">exec bash -lc</text>
  <text x="1097" y="593" font-size="12" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#38761d">"&lt;the command&gt;"</text>
  <text x="1097" y="612" font-size="10.5" fill="#555555">profile sources ROS +</text>
  <text x="1097" y="627" font-size="10.5" fill="#555555">the workspace install</text>

  <!-- host workspace -->
  <rect x="400" y="830" width="870" height="80" rx="8" fill="#fdf6e3" stroke="#dcc98c" stroke-width="1.4"/>
  <text x="420" y="858" font-size="13" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#8a6a15">~/workspace/</text>
  <text x="562" y="858" font-size="12" fill="#8a6a15">(src &#183; build &#183; install &#183; log)</text>
  <text x="420" y="880" font-size="11.5" fill="#8a6a15">same-path .air mounts keep it on the host: it persists across containers and is shared by every one (without them, each container rebuilds its own)</text>

  <line x1="820" y1="805" x2="820" y2="826" stroke="#8a6a15" stroke-width="1.4" marker-end="url(#arrowG2)"/>
  <line x1="840" y1="826" x2="840" y2="809" stroke="#8a6a15" stroke-width="1.4" marker-end="url(#arrowG2)"/>
  <text x="858" y="822" font-size="11" fill="#8a6a15">colcon writes install/ &#183; exec sources it</text>
  <defs>
    <marker id="arrowG2" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a6a15"/>
    </marker>
  </defs>
</svg>
