name: Run Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    # Pinned: ubuntu-latest is now 26.04, and actions/setup-python has no
    # Python 3.8 build for it (3.8 builds stop at 24.04).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the oldest Python Airfield supports (requires-python).
        python-version: ["3.8", "3.10"]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
        
    - name: Test with pytest
      run: |
        pytest tests/
